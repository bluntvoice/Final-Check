name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  windows:
    name: Windows build and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Validate version model
        shell: pwsh
        run: ./scripts/test-version.ps1

      - name: Restore
        run: dotnet restore FinalCheck.sln

      - name: Build
        run: dotnet build FinalCheck.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FinalCheck.sln --configuration Release --no-build

  macos-core-compatibility:
    name: macOS core compatibility
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FinalCheck.sln

      - name: Build cross-platform core projects
        shell: bash
        run: |
          dotnet build src/FinalCheck.Core/FinalCheck.Core.csproj --configuration Release --no-restore
          dotnet build src/FinalCheck.Documents/FinalCheck.Documents.csproj --configuration Release --no-restore
          dotnet build src/FinalCheck.Comparison/FinalCheck.Comparison.csproj --configuration Release --no-restore
          dotnet build src/FinalCheck.Data/FinalCheck.Data.csproj --configuration Release --no-restore

      - name: Test cross-platform core projects
        shell: bash
        run: |
          dotnet test tests/FinalCheck.Core.Tests/FinalCheck.Core.Tests.csproj --configuration Release --no-restore
          dotnet test tests/FinalCheck.Documents.Tests/FinalCheck.Documents.Tests.csproj --configuration Release --no-restore
          dotnet test tests/FinalCheck.Comparison.Tests/FinalCheck.Comparison.Tests.csproj --configuration Release --no-restore
          dotnet test tests/FinalCheck.Data.Tests/FinalCheck.Data.Tests.csproj --configuration Release --no-restore
